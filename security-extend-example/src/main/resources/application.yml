server:
  port: 8888



logging:
  level:
    org.springframework.security: debug
spring:
  security:
    oauth2:
      client:
        registration:
          gitee:
            provider: gitee
            client-id: ${GITEE_OAUTH_CLIENT_ID}
            client-name: gitee # 客户端名称
            client-secret: ${GITEE_OAUTH_CLIENT_SECRET}
            authorization-grant-type: authorization_code # 授权方式
            redirect-uri: http://127.0.0.1:8888/login/oauth2/code/gitee # 授权码模式完成授权后跳转的地址（最后一节为provider.key）
            scope: user_info # 请求的scope
        provider:
          gitee:
            authorization-uri: https://gitee.com/oauth/authorize
            token-uri: https://gitee.com/oauth/token
            user-info-uri: https://gitee.com/api/v5/user
            user-name-attribute: "name"
  thymeleaf:
    cache: false
    mode: HTML
  datasource:
    url: ${DEMO_DATASOURCE_URL}
    username: ${DEMO_DATASOURCE_USERNAME}
    password: ${DEMO_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    initialization-mode: always
    schema:
      - classpath:schema.sql